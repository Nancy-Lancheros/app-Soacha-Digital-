<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conectando Oportunidades - Carga de Evidencia</title>
    
    <!-- Fuentes: Nunito para un aspecto amigable y legible -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Iconos: FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f3f4f6; /* Fondo gris claro neutral */
            /* Centrar la app en pantallas grandes simulando un celular */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Contenedor principal que simula la pantalla del móvil */
        .mobile-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px; /* Ancho máximo de celular */
            min-height: 100vh;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 421px) {
            .mobile-container {
                min-height: 850px;
                border-radius: 40px;
                border: 8px solid #1f2937;
            }
        }

        /* Ocultar elementos visualmente pero mantenerlos funcionales (para el input de archivo) */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Animación suave para transiciones entre pantallas */
        .fade-in {
            animation: fadeIn 0.4s ease-in forwards;
        }
        
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- PANTALLA 0: LOGIN (Visible por defecto) -->
        <div id="screen-login" class="flex flex-col h-full fade-in">
            <header class="bg-blue-600 text-white p-8 rounded-b-3xl shadow-lg text-center mb-4">
                <div class="text-sm font-bold uppercase tracking-wider mb-2 opacity-90">Soacha Digital</div>
                <h1 class="text-3xl font-extrabold">Bienvenidos</h1>
            </header>
            
            <main class="flex-1 p-6 flex flex-col items-center justify-center">
                <div class="w-full text-center flex flex-col items-center">
                    <div class="bg-blue-50 text-blue-500 rounded-full w-24 h-24 flex items-center justify-center mb-6 text-4xl shadow-sm border-2 border-blue-100">
                        <i class="fa-solid fa-id-card"></i>
                    </div>
                    <label for="login-cedula" class="block text-gray-700 text-2xl font-extrabold mb-4">
                        Tu número de cédula:
                    </label>
                    <!-- type="tel" fuerza a los celulares a abrir el teclado numérico grande -->
                    <input type="tel" id="login-cedula" class="w-full text-center text-4xl p-4 border-4 border-gray-200 rounded-3xl mb-8 focus:border-blue-500 focus:outline-none transition-colors text-gray-800 font-bold" placeholder="Ej: 12345678">
                    
                    <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-[40px] p-6 shadow-xl shadow-blue-200 text-3xl font-extrabold transition-all transform active:scale-95 flex items-center justify-center border-b-8 border-blue-800">
                        ENTRAR <i class="fa-solid fa-arrow-right ml-4"></i>
                    </button>
                </div>
                
                <p class="text-gray-400 font-semibold mt-10 text-lg">
                    <i class="fa-solid fa-shield-halved mr-2"></i> Ingreso seguro
                </p>
            </main>
        </div>

        <!-- PANTALLA 1: LA MISIÓN Y EL BOTÓN GIGANTE (Oculta por defecto ahora) -->
        <div id="screen-task" class="hidden flex-col h-full fade-in">
            
            <!-- Encabezado superior -->
            <header class="bg-orange-500 text-white p-6 rounded-b-3xl shadow-md text-center">
                <div class="text-sm font-semibold uppercase tracking-wider mb-1 opacity-90">Soacha Digital</div>
                <h1 class="text-2xl font-extrabold">Conectando Oportunidades</h1>
            </header>

            <!-- Contenido Principal -->
            <main class="flex-1 p-6 flex flex-col justify-center items-center text-center">
                
                <!-- Tarjeta de la Misión -->
                <div class="bg-blue-50 w-full rounded-3xl p-8 mb-10 shadow-sm border-2 border-blue-100">
                    <div class="text-blue-500 text-5xl mb-4">
                        <i class="fa-solid fa-envelope-open-text"></i>
                    </div>
                    <h2 class="text-gray-500 font-bold text-lg mb-2">MISIÓN DE HOY</h2>
                    <p class="text-gray-800 font-extrabold text-3xl leading-tight">
                        Abrir mi correo electrónico
                    </p>
                </div>

                <!-- 
                    El secreto técnico: Un label que envuelve un input de archivo. 
                    El input está oculto, pero tocar el label gigante activa el input.
                    accept="image/*" restringe a imágenes.
                    capture="environment" fuerza a abrir la cámara trasera en móviles.
                -->
                <label for="camera-input" class="w-full bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white rounded-[40px] p-8 shadow-xl shadow-orange-200 cursor-pointer transition-all transform active:scale-95 flex flex-col items-center justify-center border-b-8 border-orange-600">
                    <i class="fa-solid fa-camera text-7xl mb-4"></i>
                    <span class="text-3xl font-extrabold">¡TOMAR FOTO!</span>
                    <span class="text-lg mt-2 font-semibold opacity-90">de mi logro</span>
                    
                    <input type="file" id="camera-input" class="visually-hidden" accept="image/*" capture="environment">
                </label>

                <p class="text-gray-400 font-semibold mt-8 text-lg">
                    Toca el botón naranja para abrir tu cámara
                </p>

            </main>
        </div>

        <!-- PANTALLA 2: CARGANDO (Oculta por defecto) -->
        <div id="screen-loading" class="hidden flex-col h-full w-full absolute top-0 left-0 bg-white justify-center items-center z-10">
            <i class="fa-solid fa-spinner fa-spin text-orange-500 text-7xl mb-6"></i>
            <h2 class="text-3xl font-bold text-gray-700">Subiendo tu foto...</h2>
            <p class="text-xl text-gray-500 mt-2">Por favor espera un momento</p>
        </div>

        <!-- PANTALLA 3: ÉXITO (Oculta por defecto) -->
        <div id="screen-success" class="hidden flex-col h-full w-full absolute top-0 left-0 bg-green-50 justify-center items-center p-8 text-center z-20">
            
            <div class="bg-green-500 text-white rounded-full w-48 h-48 flex items-center justify-center mb-8 shadow-2xl shadow-green-200 pop-in">
                <i class="fa-solid fa-check text-8xl"></i>
            </div>
            
            <h2 class="text-5xl font-extrabold text-green-700 mb-4 pop-in" style="animation-delay: 0.2s;">¡FELICIDADES!</h2>
            <p class="text-2xl text-gray-700 font-bold mb-12 pop-in" style="animation-delay: 0.4s;">
                Tu evidencia se guardó correctamente.
            </p>

            <!-- Botón para reiniciar y hacer otra prueba -->
            <button id="btn-reset" class="pop-in bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-xl py-4 px-10 rounded-full transition-colors mt-auto mb-8 w-full border-b-4 border-gray-300 active:border-b-0 active:mt-[auto+4px]" style="animation-delay: 0.6s;">
                Volver al inicio
            </button>
        </div>

    </div>

    <script>
        // Obtenemos las referencias a nuestras pantallas y botones
        const screenLogin = document.getElementById('screen-login');
        const btnLogin = document.getElementById('btn-login');
        const inputCedula = document.getElementById('login-cedula');
        
        const cameraInput = document.getElementById('camera-input');
        const screenTask = document.getElementById('screen-task');
        const screenLoading = document.getElementById('screen-loading');
        const screenSuccess = document.getElementById('screen-success');
        const btnReset = document.getElementById('btn-reset');

        // Lógica para el botón de Entrar (Login)
        btnLogin.addEventListener('click', function() {
            // Verificamos que el campo no esté vacío
            if(inputCedula.value.trim() !== '') {
                // Ocultamos la pantalla de login
                screenLogin.classList.add('hidden');
                screenLogin.classList.remove('flex');
                
                // Mostramos la pantalla de la misión
                screenTask.classList.remove('hidden');
                screenTask.classList.add('flex');
            } else {
                // Si está vacío, ponemos el borde rojo por 1.5 segundos para indicar error visualmente
                inputCedula.focus();
                inputCedula.classList.add('border-red-500');
                setTimeout(() => inputCedula.classList.remove('border-red-500'), 1500);
            }
        });

        // Escuchamos el evento 'change' del input de archivo. 
        // Este evento se dispara cuando el usuario toma la foto y la acepta en su celular.
        cameraInput.addEventListener('change', function(event) {
            // Verificamos si realmente se seleccionó/tomó una foto
            if (event.target.files && event.target.files.length > 0) {
                
                // 1. Ocultar la pantalla principal
                screenTask.classList.add('hidden');
                screenTask.classList.remove('flex');
                
                // 2. Mostrar la pantalla de carga (Simulación)
                screenLoading.classList.remove('hidden');
                screenLoading.classList.add('flex');

                // 3. Simulamos el tiempo que tardaría en subir la foto a un servidor (1.5 segundos)
                setTimeout(() => {
                    // Ocultar carga
                    screenLoading.classList.add('hidden');
                    screenLoading.classList.remove('flex');
                    
                    // Mostrar pantalla de éxito
                    screenSuccess.classList.remove('hidden');
                    screenSuccess.classList.add('flex');
                }, 1500); // 1500 milisegundos = 1.5 segundos
            }
        });

        // Lógica para el botón de "Volver al inicio"
        btnReset.addEventListener('click', function() {
            // Reseteamos el input de archivo para que permita tomar otra foto
            cameraInput.value = '';

            // Ocultamos la pantalla de éxito
            screenSuccess.classList.add('hidden');
            screenSuccess.classList.remove('flex');

            // Mostramos de nuevo la pantalla principal
            screenTask.classList.remove('hidden');
            screenTask.classList.add('flex');
        });
    </script>
</body>
</html>
